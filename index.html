<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Food Swap Tool with API</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f8f9fa;
    }
    h1 {
        text-align: center;
    }
    #swap-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"] {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    #result {
        margin-top: 20px;
        font-size: 18px;
        color: #333;
        min-height: 50px;
    }
</style>
</head>
<body>
<h1>Food Swap Tool with API</h1>
<div id="swap-container">
    <input type="text" id="foodInput" placeholder="Type a food to find a healthy alternative" />
    <div id="result"></div>
</div>

<script>
const apiKey = '3d6bcb655093446aa4c2b7cb4b3a22a9';
const input = document.getElementById('foodInput');
const resultDiv = document.getElementById('result');

let debounceTimeout = null;

input.addEventListener('input', () => {
    clearTimeout(debounceTimeout);
    debounceTimeout = setTimeout(() => {
        const userFood = input.value.toLowerCase().trim();
        if (userFood.length > 2) {
            fetchAlternative(userFood);
        } else {
            resultDiv.innerHTML = "";
        }
    }, 500); // wait 500ms after user stops typing
});

function fetchAlternative(food) {
    const url = `https://api.spoonacular.com/recipes/complexSearch?query=${food}&number=1&sort=random&apiKey=${apiKey}`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.results && data.results.length > 0) {
                const recipeId = data.results[0].id;
                getHealthyAlternative(recipeId);
            } else {
                resultDiv.innerHTML = "No suggestions found.";
            }
        })
        .catch(() => {
            resultDiv.innerHTML = "Error fetching data.";
        });
}

function getHealthyAlternative(recipeId) {
    // Fetch detailed nutrition info
    const url = `https://api.spoonacular.com/recipes/${recipeId}/nutritionWidget.json?apiKey=${apiKey}`;
    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (!data || data.status === 'failure') {
                resultDiv.innerHTML = "Could not get nutrition info.";
                return;
            }
            // Display the suggestion info
            const calories = data.calories || 'N/A';
            const nutritionText = `
                <strong>Healthy alternative:</strong> ${data.title || 'Suggested Food'}<br>
                <em>Nutritional Benefits:</em> Estimated calories: ${calories}<br>
                Making this switch can help reduce your calorie intake and improve your diet!
            `;
            resultDiv.innerHTML = nutritionText;
        })
        .catch(() => {
            resultDiv.innerHTML = "Could not retrieve detailed nutrition info.";
        });
}
</script>
</body>
</html>
