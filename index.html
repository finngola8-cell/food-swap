<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Healthy Food Swap Assistant</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f0f0f0;
  }
  h1 {
    text-align: center;
  }
  #container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    background: #fff;
    border-radius: 8px;
  }
  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
  }
  #response {
    margin-top: 20px;
    font-size: 16px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<h1>Healthy Food Swap Assistant</h1>
<div id="container">
  <input type="text" id="foodInput" placeholder="Type a food item..." />
  <div id="response"></div>
</div>

<script>
const swaps = {
  "potato chips": {
    swap: "Air-popped popcorn",
    why: "Lower in fat and calories, still crunchy.",
    calories: { original: 150, swap: 90 },
    protein: { original: "3g", swap: "3g" },
    carbs: { original: "15g", swap: "20g" },
    fat: { original: "10g", swap: "1g" },
    tip: "Add a pinch of sea salt or nutritional yeast for flavor."
  },
  "soda": {
    swap: "Sparkling water with lemon",
    why: "No added sugar, fewer empty calories.",
    calories: { original: 150, swap: 0 },
    protein: { original: "0g", swap: "0g" },
    carbs: { original: "39g", swap: "0g" },
    fat: { original: "0g", swap: "0g" },
    tip: "Add fresh fruit slices for flavor."
  },
  "white bread": {
    swap: "Whole grain bread",
    why: "Higher in fiber, keeps you full longer.",
    calories: { original: 70, swap: 80 },
    protein: { original: "2g", swap: "4g" },
    carbs: { original: "13g", swap: "15g" },
    fat: { original: "1g", swap: "1.5g" },
    tip: "Look for 100% whole grain labels."
  }
  // Add more foods if needed
};

const input = document.getElementById('foodInput');
const responseDiv = document.getElementById('response');

input.addEventListener('input', () => {
  const userFood = input.value.toLowerCase().trim();
  if (swaps[userFood]) {
    const data = swaps[userFood];
    responseDiv.innerHTML = `
      <strong>Healthier Swap:</strong> ${data.swap}<br>
      <strong>Why:</strong> ${data.why}<br>
      <strong>Calories:</strong> ${data.calories.original} -> ${data.calories.swap}<br>
      <strong>Protein:</strong> ${data.protein.original} -> ${data.protein.swap}<br>
      <strong>Carbs:</strong> ${data.carbs.original} -> ${data.carbs.swap}<br>
      <strong>Fat:</strong> ${data.fat.original} -> ${data.fat.swap}<br>
      <strong>Tip:</strong> ${data.tip}
    `;
  } else if (userFood.length > 2) {
    responseDiv.innerHTML = "Try another food or add more options.";
  } else {
    responseDiv.innerHTML = "";
  }
});
</script>
</body>
</html>
