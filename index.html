<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Stock Finder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin: 30px 0;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      margin-top: 20px;
    }

    .green {
      color: #22c55e;
    }

    .red {
      color: #ef4444;
    }

    .loading {
      opacity: 0.7;
    }

    .disclaimer {
      margin-top: 30px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📈 AI Stock Finder</h1>

  <div class="search-box">
    <input
      type="text"
      id="stockInput"
      placeholder="Enter stock symbol (AAPL, TSLA, NVDA)"
    />
    <button onclick="getStock()">Analyze</button>
  </div>

  <div id="result"></div>

  <div class="disclaimer">
    This tool is for educational purposes only and not financial advice.
  </div>
</div>

<script>
  const API_KEY = "8e3ec6acec291620ce9a92d720366eab";

  async function getStock() {
    const symbol = document
      .getElementById("stockInput")
      .value
      .trim()
      .toUpperCase();

    const resultDiv = document.getElementById("result");

    if (!symbol) {
      resultDiv.innerHTML = `
        <div class="card">
          Please enter a stock symbol.
        </div>
      `;
      return;
    }

    resultDiv.innerHTML = `
      <div class="card loading">
        Loading real-time stock data...
      </div>
    `;

    try {
      const response = await fetch(
        `https://financialmodelingprep.com/api/v3/quote/${symbol}?apikey=${API_KEY}`
      );

      const data = await response.json();

      if (!data || data.length === 0) {
        resultDiv.innerHTML = `
          <div class="card">
            Stock not found.
          </div>
        `;
        return;
      }

      const stock = data[0];

      const changeClass = stock.change >= 0 ? "green" : "red";

      let recommendation = "Hold";
      let reason = "Market conditions appear neutral.";

      if (stock.change > 2) {
        recommendation = "Potential Buy";
        reason = "Strong positive momentum today.";
      } else if (stock.change < -2) {
        recommendation = "Watch Carefully";
        reason = "Large decline may indicate volatility.";
      }

      resultDiv.innerHTML = `
        <div class="card">
          <h2>${stock.name} (${stock.symbol})</h2>

          <p><strong>Price:</strong> $${stock.price}</p>

          <p>
            <strong>Daily Change:</strong>
            <span class="${changeClass}">
              ${stock.change} (${stock.changesPercentage.toFixed(2)}%)
            </span>
          </p>

          <p><strong>Volume:</strong> ${stock.volume.toLocaleString()}</p>

          <hr>

          <h3>AI Recommendation: ${recommendation}</h3>

          <p>${reason}</p>
        </div>
      `;

    } catch (error) {
      console.error(error);

      resultDiv.innerHTML = `
        <div class="card">
          Error fetching stock data.
        </div>
      `;
    }
  }
</script>

</body>
</html>
